name: Publish Google Photos Sifter

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    env:
      BASE_PATH: /photos-sifter
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      # Enable Settings → Pages → GitHub Actions in this repository.
      # The project inherits bertspaan.nl from bertspaan/bertspaan.github.io.
      # Do not set this project’s custom domain to bertspaan.nl: it lives at a subpath.
      - name: Verify publishing address
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          if [ "${PAGES_URL%/}" != "https://bertspaan.nl/photos-sifter" ]; then
            echo "::error::Expected https://bertspaan.nl/photos-sifter, but Pages reports ${PAGES_URL}. Configure bertspaan.nl on the account's main Pages site and leave this project's custom domain empty."
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting and types
        run: pnpm lint

      - name: Run tests
        run: pnpm test

      - name: Build static site
        run: pnpm build

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
